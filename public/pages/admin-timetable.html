<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Timetable — Admin</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  .tt-table { width: 100%; border-collapse: collapse; }
  .tt-table th { background: var(--paper); font-size: 11px; text-transform: uppercase; color: var(--ink-soft); padding: 8px; border: 1px solid var(--line); }
  .tt-table td { border: 1px solid var(--line); padding: 0; vertical-align: top; height: 64px; width: 14%; }
  .tt-cell { height: 100%; padding: 8px 9px; cursor: pointer; transition: background 0.15s; }
  .tt-cell:hover { background: var(--teacher-tint); }
  .tt-cell.filled { background: var(--admin-tint); }
  .tt-cell .subj { font-weight: 600; font-size: 13px; }
  .tt-cell .teach { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
  .tt-cell .empty-plus { color: var(--ink-soft); font-size: 20px; text-align: center; display: block; padding-top: 14px; }
  .period-col { font-weight: 600; font-size: 12.5px; background: var(--paper); text-align: center; width: 60px; }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div>
        <div class="eyebrow">Admin portal</div>
        <h1>Timetable builder</h1>
      </div>
    </div>

    <div class="panel">
      <div class="field" style="max-width:320px; margin-bottom:20px;">
        <label>Class</label>
        <select id="classSelect"></select>
      </div>
      <div style="overflow-x:auto;">
        <table class="tt-table" id="grid"></table>
      </div>
      <div class="small-text muted" style="margin-top:14px;">Click any cell to add or edit a period. Click a filled cell to edit or remove it.</div>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2 id="modalTitle" style="margin-bottom:18px;">Edit period</h2>
    <form id="slotForm">
      <input type="hidden" id="f_day" />
      <input type="hidden" id="f_period" />
      <input type="hidden" id="f_slotId" />
      <div class="field"><label>Subject</label><input id="f_subject" required /></div>
      <div class="field">
        <label>Teacher</label>
        <select id="f_teacher"><option value="">— none —</option></select>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div class="field"><label>Start time</label><input id="f_start" placeholder="09:00" /></div>
        <div class="field"><label>End time</label><input id="f_end" placeholder="09:45" /></div>
      </div>
      <button class="btn full" type="submit">Save period</button>
      <button class="btn full danger" type="button" id="deleteBtn" style="display:none; margin-top:8px;" onclick="deleteSlot()">Remove period</button>
    </form>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  requireAuth(["admin"]);
  renderSidebar("timetable");

  const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const PERIODS = [1, 2, 3, 4, 5, 6, 7, 8];
  let slotsByKey = {}; // "day-period" -> slot
  let currentClassId = null;

  async function init() {
    const classes = await api("/classes");
    document.getElementById("classSelect").innerHTML = classes
      .map((c) => `<option value="${c._id}">${c.name}-${c.section}</option>`)
      .join("");
    const teachers = await api("/teachers");
    document.getElementById("f_teacher").innerHTML =
      `<option value="">— none —</option>` + teachers.map((t) => `<option value="${t._id}">${t.name}</option>`).join("");

    if (classes.length) {
      currentClassId = classes[0]._id;
      await loadGrid();
    }
  }

  document.getElementById("classSelect").addEventListener("change", async (e) => {
    currentClassId = e.target.value;
    await loadGrid();
  });

  async function loadGrid() {
    const slots = await api(`/misc/timetable/class/${currentClassId}`);
    slotsByKey = {};
    slots.forEach((s) => { slotsByKey[`${s.day}-${s.period}`] = s; });
    renderGrid();
  }

  function renderGrid() {
    let html = `<tr><th class="period-col">Period</th>${DAYS.map((d) => `<th>${d}</th>`).join("")}</tr>`;
    PERIODS.forEach((p) => {
      html += `<tr><td class="period-col">${p}</td>`;
      DAYS.forEach((d) => {
        const slot = slotsByKey[`${d}-${p}`];
        if (slot) {
          html += `<td><div class="tt-cell filled" onclick="openCell('${d}', ${p})">
            <div class="subj">${slot.subject}</div>
            <div class="teach">${slot.teacher ? slot.teacher.name : ""}${slot.startTime ? " · " + slot.startTime : ""}</div>
          </div></td>`;
        } else {
          html += `<td><div class="tt-cell" onclick="openCell('${d}', ${p})"><span class="empty-plus">+</span></div></td>`;
        }
      });
      html += `</tr>`;
    });
    document.getElementById("grid").innerHTML = html;
  }

  function openCell(day, period) {
    const slot = slotsByKey[`${day}-${period}`];
    document.getElementById("f_day").value = day;
    document.getElementById("f_period").value = period;
    document.getElementById("modalTitle").textContent = `${day} · Period ${period}`;
    document.getElementById("f_slotId").value = slot ? slot._id : "";
    document.getElementById("f_subject").value = slot ? slot.subject : "";
    document.getElementById("f_teacher").value = slot && slot.teacher ? slot.teacher._id : "";
    document.getElementById("f_start").value = slot ? slot.startTime || "" : "";
    document.getElementById("f_end").value = slot ? slot.endTime || "" : "";
    document.getElementById("deleteBtn").style.display = slot ? "block" : "none";
    document.getElementById("modalBackdrop").classList.add("show");
  }
  function closeModal() { document.getElementById("modalBackdrop").classList.remove("show"); }

  document.getElementById("slotForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await api("/misc/timetable", {
        method: "POST",
        body: JSON.stringify({
          schoolClass: currentClassId,
          day: document.getElementById("f_day").value,
          period: Number(document.getElementById("f_period").value),
          subject: document.getElementById("f_subject").value,
          teacher: document.getElementById("f_teacher").value || undefined,
          startTime: document.getElementById("f_start").value,
          endTime: document.getElementById("f_end").value,
        }),
      });
      toast("Period saved");
      closeModal();
      loadGrid();
    } catch (err) {
      toast(err.message, true);
    }
  });

  async function deleteSlot() {
    const id = document.getElementById("f_slotId").value;
    if (!id) return;
    try {
      await api(`/misc/timetable/${id}`, { method: "DELETE" });
      toast("Period removed");
      closeModal();
      loadGrid();
    } catch (err) {
      toast(err.message, true);
    }
  }

  init().catch((err) => toast(err.message, true));
</script>
</body>
</html>

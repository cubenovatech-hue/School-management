<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Students — Admin</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div>
        <div class="eyebrow">Admin portal</div>
        <h1>Students</h1>
      </div>
      <button class="btn" onclick="openModal()">+ Add student</button>
    </div>

    <div class="panel">
      <table>
        <thead><tr><th>Admission No</th><th>Name</th><th>Class</th><th>Roll</th><th>Guardian Phone</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty-state" style="display:none;">No students yet. Add your first one.</div>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2 style="margin-bottom:18px;">Add student</h2>
    <form id="studentForm">
      <div class="field"><label>Full name</label><input id="f_name" required /></div>
      <div class="field"><label>Admission No.</label><input id="f_adm" required /></div>
      <div class="field"><label>Class</label><select id="f_class" required></select></div>
      <div class="field"><label>Roll No.</label><input id="f_roll" /></div>
      <div class="field"><label>Guardian phone</label><input id="f_phone" /></div>
      <div class="field"><label>Annual fee (₹)</label><input id="f_fee" type="number" value="45000" /></div>
      <div class="field">
        <label>Student login email <span class="muted small-text">(optional — creates a login for the student)</span></label>
        <input id="f_loginEmail" type="email" placeholder="student@school.io" />
      </div>
      <div class="field">
        <label>Parent/guardian login email <span class="muted small-text">(optional — creates or links a parent account)</span></label>
        <input id="f_guardianEmail" type="email" placeholder="guardian@mail.com" />
      </div>
      <button class="btn" type="submit" style="width:100%; justify-content:center;">Save student</button>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="credsBackdrop">
  <div class="modal">
    <button class="modal-close" onclick="closeCredsModal()">×</button>
    <h2 style="margin-bottom:6px;">Account created</h2>
    <p class="small-text muted" style="margin-bottom:18px;">Copy these now — passwords aren't shown again. Share them securely with the family.</p>
    <div id="credsBody"></div>
    <button class="btn secondary full" style="margin-top:16px;" onclick="closeCredsModal()">Done</button>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  requireAuth(["admin"]);
  renderSidebar("students");

  let classes = [];

  async function loadStudents() {
    const students = await api("/students");
    const tbody = document.getElementById("rows");
    document.getElementById("empty").style.display = students.length ? "none" : "block";
    tbody.innerHTML = students
      .map(
        (s) => `<tr>
          <td>${s.admissionNo}</td>
          <td>${s.name}</td>
          <td>${s.schoolClass ? s.schoolClass.name + "-" + s.schoolClass.section : "-"}</td>
          <td>${s.rollNo || "-"}</td>
          <td>${s.guardianPhone || "-"}</td>
          <td><button class="btn ghost small" onclick="removeStudent('${s._id}')">Remove</button></td>
        </tr>`
      )
      .join("");
  }

  async function removeStudent(id) {
    if (!confirm("Remove this student?")) return;
    try {
      await api(`/students/${id}`, { method: "DELETE" });
      toast("Student removed");
      loadStudents();
    } catch (err) {
      toast(err.message, true);
    }
  }

  function openModal() {
    document.getElementById("modalBackdrop").classList.add("show");
  }
  function closeModal() {
    document.getElementById("modalBackdrop").classList.remove("show");
  }

  document.getElementById("studentForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      const res = await api("/students", {
        method: "POST",
        body: JSON.stringify({
          name: document.getElementById("f_name").value,
          admissionNo: document.getElementById("f_adm").value,
          schoolClass: document.getElementById("f_class").value,
          rollNo: document.getElementById("f_roll").value,
          guardianPhone: document.getElementById("f_phone").value,
          feeStructureAmount: Number(document.getElementById("f_fee").value) || 0,
          loginEmail: document.getElementById("f_loginEmail").value || undefined,
          guardianLoginEmail: document.getElementById("f_guardianEmail").value || undefined,
        }),
      });
      toast("Student added");
      closeModal();
      e.target.reset();
      loadStudents();
      showCredentials(res.credentials);
    } catch (err) {
      toast(err.message, true);
    }
  });

  function showCredentials(credentials) {
    if (!credentials || (!credentials.student && !credentials.parent && !credentials.studentAccountError && !credentials.parentLinked)) return;

    let html = "";
    if (credentials.student) {
      html += `<div class="panel" style="margin-bottom:10px;">
        <div class="small-text muted" style="margin-bottom:4px;">STUDENT LOGIN</div>
        <div><strong>Email:</strong> ${credentials.student.email}</div>
        <div><strong>Password:</strong> <code>${credentials.student.password}</code></div>
      </div>`;
    }
    if (credentials.studentAccountError) {
      html += `<div class="small-text" style="color:var(--danger); margin-bottom:10px;">${credentials.studentAccountError}</div>`;
    }
    if (credentials.parent) {
      html += `<div class="panel" style="margin-bottom:10px;">
        <div class="small-text muted" style="margin-bottom:4px;">PARENT LOGIN</div>
        <div><strong>Email:</strong> ${credentials.parent.email}</div>
        <div><strong>Password:</strong> <code>${credentials.parent.password}</code></div>
      </div>`;
    }
    if (credentials.parentLinked) {
      html += `<div class="small-text muted">${credentials.parentLinked}</div>`;
    }
    if (!html) return;

    document.getElementById("credsBody").innerHTML = html;
    document.getElementById("credsBackdrop").classList.add("show");
  }
  function closeCredsModal() {
    document.getElementById("credsBackdrop").classList.remove("show");
  }

  (async function init() {
    try {
      classes = await api("/classes");
      document.getElementById("f_class").innerHTML = classes
        .map((c) => `<option value="${c._id}">${c.name}-${c.section}</option>`)
        .join("");
      await loadStudents();
    } catch (err) {
      toast(err.message, true);
    }
  })();
</script>
</body>
</html>

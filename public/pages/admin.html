<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Overview — Admin</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div>
        <div class="eyebrow">Admin portal</div>
        <h1>Good day, <span id="adminName"></span></h1>
      </div>
      <a href="/pages/leads.html" class="btn">Open Admissions CRM</a>
    </div>

    <div class="stat-grid" id="statGrid"></div>

    <div class="panel">
      <div class="panel-head">
        <h2>Admissions pipeline</h2>
        <a href="/pages/leads.html" class="small-text">View board →</a>
      </div>
      <div id="leadsChart"></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Today's attendance</h2></div>
      <div id="attChart"></div>
    </div>
  </main>
</div>

<script src="/js/app.js"></script>
<script>
  const user = requireAuth(["admin"]);
  renderSidebar("overview");
  document.getElementById("adminName").textContent = user.name.split(" ")[0];

  (async function load() {
    try {
      const d = await api("/dashboard/admin");

      document.getElementById("statGrid").innerHTML = `
        <div class="stat-tile"><div class="value">${d.studentCount}</div><div class="label">Active students</div></div>
        <div class="stat-tile"><div class="value">${d.teacherCount}</div><div class="label">Teachers</div></div>
        <div class="stat-tile"><div class="value">${d.classCount}</div><div class="label">Classes</div></div>
        <div class="stat-tile"><div class="value">${d.activeLeads}</div><div class="label">Open admission leads</div></div>
        <div class="stat-tile"><div class="value">${fmtCurrency(d.feeCollected)}</div><div class="label">Fees collected</div></div>
        <div class="stat-tile"><div class="value" style="color:var(--danger)">${fmtCurrency(d.feeOutstanding)}</div><div class="label">Fees outstanding</div></div>
      `;

      const shortLabel = {
        new: "New",
        contacted: "Contact",
        visit_scheduled: "Visit",
        application_submitted: "Applied",
        enrolled: "Enrolled",
        lost: "Lost",
      };
      const stageOrder = ["new", "contacted", "visit_scheduled", "application_submitted", "enrolled", "lost"];
      const counts = stageOrder.map((s) => d.leadsByStage[s] || 0);
      const maxCount = Math.max(...counts, 1);
      const barW = 60, gap = 24, chartH = 160, leftPad = 10;
      const svgW = stageOrder.length * (barW + gap);
      let bars = "";
      stageOrder.forEach((s, i) => {
        const h = Math.round((counts[i] / maxCount) * (chartH - 30));
        const x = leftPad + i * (barW + gap);
        const y = chartH - h;
        bars += `
          <rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="3" fill="#C0392B"></rect>
          <text x="${x + barW / 2}" y="${y - 8}" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600" fill="#1B2430">${counts[i]}</text>
          <text x="${x + barW / 2}" y="${chartH + 18}" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" fill="#4B5563">${shortLabel[s]}</text>
        `;
      });
      document.getElementById("leadsChart").innerHTML = `
        <svg viewBox="0 0 ${svgW + leftPad} ${chartH + 34}" style="width:100%; max-width:640px; height:auto;">
          <line x1="0" y1="${chartH}" x2="${svgW + leftPad}" y2="${chartH}" stroke="#E4DFD3" stroke-width="1"></line>
          ${bars}
        </svg>
      `;

      const present = d.todayAttendance.present;
      const total = Math.max(d.todayAttendance.total, 1);
      const absent = Math.max(d.todayAttendance.total - present, 0);
      const pct = total ? present / d.todayAttendance.total || 0 : 0;
      const r = 60, cx = 90, cy = 90, circumference = 2 * Math.PI * r;
      const presentLen = d.todayAttendance.total ? (present / d.todayAttendance.total) * circumference : 0;
      document.getElementById("attChart").innerHTML = `
        <div style="display:flex; align-items:center; gap:28px; flex-wrap:wrap;">
          <svg width="180" height="180" viewBox="0 0 180 180">
            <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#E4DFD3" stroke-width="22"></circle>
            <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#2F6D5E" stroke-width="22"
              stroke-dasharray="${presentLen} ${circumference - presentLen}"
              stroke-dashoffset="${circumference / 4}"
              transform="rotate(0 ${cx} ${cy})" stroke-linecap="round"></circle>
            <text x="${cx}" y="${cy - 4}" text-anchor="middle" font-family="Fraunces, serif" font-size="26" font-weight="600" fill="#1B2430">${d.todayAttendance.total ? Math.round((present / d.todayAttendance.total) * 100) : 0}%</text>
            <text x="${cx}" y="${cy + 16}" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" fill="#4B5563">present</text>
          </svg>
          <div style="font-size:13.5px;">
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
              <span style="width:10px; height:10px; border-radius:50%; background:#2F6D5E; display:inline-block;"></span>
              Present / Late — <strong>${present}</strong>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="width:10px; height:10px; border-radius:50%; background:#E4DFD3; display:inline-block;"></span>
              Absent / unmarked — <strong>${absent}</strong>
            </div>
          </div>
        </div>
      `;
    } catch (err) {
      toast(err.message, true);
    }
  })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Northfield School — Sign in</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="login-shell">
  <div class="id-card">
    <div class="brand-mark">N</div>
    <div class="school-name">Northfield School</div>
    <div class="tagline">Management portal &amp; admissions CRM</div>

    <div id="errorBanner" class="error-banner"></div>

    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required placeholder="you@school.io" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••" />
      </div>
      <button class="btn" type="submit" style="width:100%; justify-content:center;">Sign in</button>
    </form>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  // If already logged in, go straight to the right portal
  (function () {
    const user = getUser();
    const token = localStorage.getItem("token");
    if (user && token) {
      window.location.href = `/pages/${user.role}.html`;
    }
  })();

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const banner = document.getElementById("errorBanner");
    banner.classList.remove("show");

    try {
      const data = await api("/auth/login", {
        method: "POST",
        body: JSON.stringify({ email, password }),
      });
      localStorage.setItem("token", data.token);
      localStorage.setItem("user", JSON.stringify(data.user));
      window.location.href = `/pages/${data.user.role}.html`;
    } catch (err) {
      banner.textContent = err.message;
      banner.classList.add("show");
    }
  });
</script>
</body>
</html>

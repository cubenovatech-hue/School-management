<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Northfield School — Sign in</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="login-shell">
  <div class="id-card">
    <div class="brand-mark">N</div>
    <div class="school-name">Northfield School</div>
    <div class="tagline">Management portal &amp; admissions CRM</div>

    <div id="errorBanner" class="error-banner"></div>

    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required placeholder="you@school.io" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••" />
      </div>
      <button class="btn" type="submit" style="width:100%; justify-content:center;">Sign in</button>
    </form>

    <div class="demo-accounts">
      <div style="margin-bottom:6px; font-weight:600; color: var(--ink);">Demo accounts (click to fill)</div>
      <div class="row" data-email="admin@school.io" data-pass="admin123">
        <span><span class="tag" style="color:#2F6D5E;">Admin</span> admin@school.io</span>
        <span>admin123</span>
      </div>
      <div class="row" data-email="teacher@school.io" data-pass="teacher123">
        <span><span class="tag" style="color:#3A5BA0;">Teacher</span> teacher@school.io</span>
        <span>teacher123</span>
      </div>
      <div class="row" data-email="arjun@school.io" data-pass="student123">
        <span><span class="tag" style="color:#C97A2B;">Student</span> arjun@school.io</span>
        <span>student123</span>
      </div>
      <div class="row" data-email="arjun.parent@mail.com" data-pass="parent123">
        <span><span class="tag" style="color:#8B4F9E;">Parent</span> arjun.parent@mail.com</span>
        <span>parent123</span>
      </div>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  // If already logged in, go straight to the right portal
  (function () {
    const user = getUser();
    const token = localStorage.getItem("token");
    if (user && token) {
      window.location.href = `/pages/${user.role}.html`;
    }
  })();

  document.querySelectorAll(".demo-accounts .row").forEach((row) => {
    row.addEventListener("click", () => {
      document.getElementById("email").value = row.dataset.email;
      document.getElementById("password").value = row.dataset.pass;
    });
  });

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const banner = document.getElementById("errorBanner");
    banner.classList.remove("show");

    try {
      const data = await api("/auth/login", {
        method: "POST",
        body: JSON.stringify({ email, password }),
      });
      localStorage.setItem("token", data.token);
      localStorage.setItem("user", JSON.stringify(data.user));
      window.location.href = `/pages/${data.user.role}.html`;
    } catch (err) {
      banner.textContent = err.message;
      banner.classList.add("show");
    }
  });
</script>
</body>
</html>
